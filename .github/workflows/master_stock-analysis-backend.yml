name: Azure Web App CI/CD and Schedulers

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *" # News links ingestion at 03:30 IST
    - cron: "30 22 * * *" # Stock ideas daily at 04:00 IST
    - cron: "30 21 * * 6" # Weekly NSE price history at 03:00 IST Sunday

permissions:
  contents: read

concurrency:
  group: azure-webapp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    env:
      AZURE_WEBAPP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
      AZURE_WEBAPP_SLOT_NAME: ${{ secrets.AZURE_WEBAPP_SLOT_NAME }}
      AZURE_WEBAPP_PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Azure deploy inputs
        run: |
          if [ -z "$AZURE_WEBAPP_NAME" ]; then
            echo "AZURE_WEBAPP_NAME secret is missing"
            exit 1
          fi

          if [ -z "$AZURE_WEBAPP_PUBLISH_PROFILE" ]; then
            echo "AZURE_WEBAPP_PUBLISH_PROFILE secret is missing"
            exit 1
          fi

          echo "Deploy target app: $AZURE_WEBAPP_NAME"
          if [ -n "$AZURE_WEBAPP_SLOT_NAME" ]; then
            echo "Deploy target slot: $AZURE_WEBAPP_SLOT_NAME"
          else
            echo "Deploy target slot: Production"
          fi

      - name: Deploy to Azure Web App (production)
        if: env.AZURE_WEBAPP_SLOT_NAME == ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Deploy to Azure Web App (slot)
        if: env.AZURE_WEBAPP_SLOT_NAME != ''
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_WEBAPP_SLOT_NAME }}
          publish-profile: ${{ env.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Smoke test health endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is missing"
            exit 1
          fi

          health_url="${APP_BASE_URL%/}/health"
          db_url="${APP_BASE_URL%/}/health/db"

          echo "Checking $health_url"
          curl --fail --silent --show-error "$health_url"

          echo "Checking $db_url"
          curl --fail --silent --show-error "$db_url"

  news_links_ingestion:
    if: github.event_name == 'schedule' && github.event.schedule == '0 22 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger news links ingestion job
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is missing"
            exit 1
          fi

          job_url="${APP_BASE_URL%/}/v1/jobs/news-links-ingestion"
          echo "Calling $job_url"

          if [ -n "$CRON_SECRET" ]; then
            response=$(curl -sS -w "\n%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$job_url")
          else
            response=$(curl -sS -w "\n%{http_code}" "$job_url")
          fi

          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)

          echo "HTTP status: $code"
          echo "Response body: $body"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi

  stock_ideas_daily:
    if: github.event_name == 'schedule' && github.event.schedule == '30 22 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger stock ideas daily job
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is missing"
            exit 1
          fi

          job_url="${APP_BASE_URL%/}/v1/jobs/stock-ideas-daily"
          echo "Calling $job_url"

          if [ -n "$CRON_SECRET" ]; then
            response=$(curl -sS -w "\n%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$job_url")
          else
            response=$(curl -sS -w "\n%{http_code}" "$job_url")
          fi

          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)

          echo "HTTP status: $code"
          echo "Response body: $body"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi

  weekly_nse_price_history:
    if: github.event_name == 'schedule' && github.event.schedule == '30 21 * * 6'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Trigger weekly NSE price history job
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ]; then
            echo "APP_BASE_URL secret is missing"
            exit 1
          fi

          job_url="${APP_BASE_URL%/}/v1/jobs/weekly-nse-price-history"
          echo "Calling $job_url"

          if [ -n "$CRON_SECRET" ]; then
            response=$(curl -sS -w "\n%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$job_url")
          else
            response=$(curl -sS -w "\n%{http_code}" "$job_url")
          fi

          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)

          echo "HTTP status: $code"
          echo "Response body: $body"

          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi