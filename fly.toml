# fly.toml - Fly.io deployment configuration
app = "grow-wealth-backend"

primary_region = "sin"  # Singapore - adjust based on your preference

[build]
  dockerfile = "Dockerfile"

[env]
  # Environment variables for the application
  PYTHONUNBUFFERED = "1"

[env.production]
  PYTHONUNBUFFERED = "1"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  
  [services.concurrency]
    hard_limit = 25
    soft_limit = 20
  
  [[services.ports]]
    handlers = ["http"]
    port = 80
  
  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.http_checks.alive]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

# Optional: Set secrets for DATABASE_URL via fly.io CLI:
# fly secrets set DATABASE_URL="your-database-url"
# 
# Or set it in your fly.toml using [env]:
# [env]
#   DATABASE_URL = "your-connection-string"
